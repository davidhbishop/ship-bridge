name = "trmnl-bridge"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "FORECAST"
bucket_name = "forecast"

[vars]
PORT_NAME = "Conwy"
FORECAST_AREA = "11"
INSHORE_AREAS = "9,10,11"
# Only for tide records without an `at` UTC time: "local", or the fixed hours ahead of UTC they were stored in.
TIDE_STORED_OFFSET = "local"
GATE_OPEN_HOURS = "-2"
GATE_CLOSE_HOURS = "3"
STRONG_WIND_FORCE = "6"
GATE_WARN_MINUTES = "90"

# Secret: wrangler secret put API_KEY  (the same value goes in each TRMNL plugin's "Bridge API key" field)
